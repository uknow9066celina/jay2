<title>알록달록 색칠놀이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: one-screen app. Home = scrolling picture grid; Paint = top bar + square board + big crayon palette (side in landscape, bottom in portrait) */
:root{
  --bg:#f1edff; --card:#ffffff; --ink:#3b2f4a; --line:#3b2f4a;
  --pink:#ff5fa2; --sun:#ffd23f; --sky:#7cc6ff; --soft:#e3dcfb;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{height:100%}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

/* ---------- Home ---------- */
#home{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.hero{max-width:1100px;margin:0 auto 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:72px;height:72px;flex:none}
.hero h1{margin:0;font-size:clamp(30px,5vw,46px);font-weight:400;letter-spacing:.5px;line-height:1.1}
.hero h1 .a{color:var(--pink)} .hero h1 .b{color:#f0a400} .hero h1 .c{color:#3aa3e8} .hero h1 .d{color:#7a5ae0}
.hero p{margin:4px 0 0;font-size:19px;opacity:.75}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:var(--card);border-radius:26px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 var(--soft);transition:transform .15s}
.card:active{transform:scale(.95)}
.card .thumb{width:100%;aspect-ratio:1;max-width:100%;border-radius:18px;overflow:hidden;background:#fff;position:relative}
.card .thumb svg{width:100%;height:100%;display:block}
.card .name{font-size:21px}
.card .done{position:absolute;top:6px;right:6px;width:30px;height:30px}

/* ---------- Paint ---------- */
#paint{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "stage" "pal";gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.top{grid-area:top;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbtn{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:10px 16px;font-size:19px;box-shadow:0 3px 0 var(--soft);min-height:52px}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--soft)}
.tbtn svg{width:26px;height:26px}
.tbtn[disabled]{opacity:.35}
.ptitle{flex:1;text-align:center;font-size:26px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.confirm{display:flex;align-items:center;gap:8px;background:#fff3c4;border-radius:999px;padding:6px 8px 6px 16px;font-size:18px}
.confirm button{border-radius:999px;padding:8px 14px;font-size:18px;background:var(--card)}
.confirm .yes{background:var(--pink);color:#fff}
.stage{grid-area:stage;min-height:0;display:flex;align-items:center;justify-content:center}
.board{position:relative;background:#fff;border-radius:28px;box-shadow:0 6px 0 var(--soft);overflow:hidden;touch-action:none;max-width:100%}
.board svg{width:100%;height:100%;display:block}
.palette{grid-area:pal;display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;justify-items:center;background:var(--card);border-radius:26px;padding:10px;box-shadow:0 4px 0 var(--soft)}
.sw{width:52px;height:52px;border-radius:50%;position:relative;transition:transform .15s}
.sw svg{width:100%;height:100%;display:block}
.sw.on{transform:scale(1.15)}
.sw.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:4px solid var(--ink)}
.sw .lbl{position:absolute;inset:auto 0 -2px;font-size:11px;text-align:center}
@media (orientation:landscape) and (min-width:700px){
  #paint{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "stage pal"}
  .palette{grid-template-columns:repeat(3,58px);align-content:center;overflow-y:auto;padding:14px}
  .sw{width:56px;height:56px}
}

/* art */
.art .r{fill:#fff;stroke:var(--line);stroke-width:2.6;stroke-linejoin:round;cursor:pointer}
.art .bg{stroke:none}
.art .d{stroke:var(--line);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.art .dk{fill:var(--line);stroke:none}
.art .hl{fill:#fff;stroke:none}

/* sparkles */
.spark{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;pointer-events:none;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:fly .6s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* celebration */
.party{position:fixed;inset:0;background:rgba(59,47,74,.35);display:grid;place-items:center;z-index:20;padding:20px}
.party .box{background:var(--card);border-radius:32px;padding:28px 28px 22px;text-align:center;max-width:420px;width:100%;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.party h2{margin:6px 0 4px;font-size:38px;font-weight:400;color:var(--pink)}
.party p{margin:0 0 18px;font-size:20px}
.party .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.party .row button{font-size:20px;border-radius:999px;padding:12px 20px;background:var(--soft)}
.party .row .go{background:var(--pink);color:#fff}
.party svg.stars{width:140px;height:90px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.party .stars path{animation:twinkle 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.party .stars path:nth-child(2){animation-delay:.3s}.party .stars path:nth-child(3){animation-delay:.6s}
@keyframes twinkle{from{transform:scale(.8) rotate(-10deg)}to{transform:scale(1.1) rotate(10deg)}}
@media (prefers-reduced-motion:reduce){.spark,.party .box,.party .stars path{animation:none}.card,.sw{transition:none}}
</style>

const C=(x,y,r)=>`<circle class="r" cx="${x}" cy="${y}" r="${r}"/>`;
const E=(x,y,rx,ry,rot=0)=>`<ellipse class="r" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"${rot?` transform="rotate(${rot} ${x} ${y})"`:''}/>`;
const R=(x,y,w,h,rx=0)=>`<rect class="r" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;
const P=d=>`<path class="r" d="${d}"/>`;
const L=d=>`<path class="d" fill="none" d="${d}"/>`;
const DOT=(x,y,r=2.5)=>`<circle class="d dk" cx="${x}" cy="${y}" r="${r}"/>`;
const eye=(x,y,s=4.5)=>`<circle class="d dk" cx="${x}" cy="${y}" r="${s}"/><circle class="d hl" cx="${x+s*.35}" cy="${y-s*.4}" r="${s*.35}"/>`;
const eyes=(x1,x2,y,s)=>eye(x1,y,s)+eye(x2,y,s);
const smile=(x,y,w=7)=>L(`M${x-w} ${y} Q${x} ${y+w} ${x+w} ${y}`);
const cheeks=(x1,x2,y,rx=8,ry=5)=>E(x1,y,rx,ry)+E(x2,y,rx,ry);
const BG=`<rect class="r bg" x="0" y="0" width="200" height="200"/>`;
const star=(x,y,Ro,ri=Ro*.48)=>{const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?ri:Ro;p.push((x+rr*Math.cos(a)).toFixed(1)+' '+(y+rr*Math.sin(a)).toFixed(1));}return P('M'+p.join(' L')+' Z');};
const heart=(x,y,s)=>P(`M${x} ${y+.8*s} C${x-1.4*s} ${y-.2*s} ${x-.6*s} ${y-1.1*s} ${x} ${y-.4*s} C${x+.6*s} ${y-1.1*s} ${x+1.4*s} ${y-.2*s} ${x} ${y+.8*s} Z`);
const cloud=(x,y)=>P(`M${x-30} ${y+12} a12 12 0 0 1 4 -22 a16 16 0 0 1 28 -6 a14 14 0 0 1 24 10 a10 10 0 0 1 -2 18 Z`);
const band=(Ro,ri,cy=150)=>P(`M${100-Ro} ${cy} A${Ro} ${Ro} 0 0 1 ${100+Ro} ${cy} L${100+ri} ${cy} A${ri} ${ri} 0 0 0 ${100-ri} ${cy} Z`);
const petals=(cx,cy,d,r,n=6)=>{let s='';for(let i=0;i<n;i++){const a=i*2*Math.PI/n-Math.PI/2;s+=C((cx+d*Math.cos(a)).toFixed(1),(cy+d*Math.sin(a)).toFixed(1),r);}return s;};

/* ---------- palette ---------- */
const COLORS=[
 ['#ff5a6e','빨강'],['#ff8a4c','주황'],['#ffc83d','노랑'],['#fff07a','연노랑'],['#a8e05f','연두'],['#3fbf7f','초록'],
 ['#6fdccf','민트'],['#62c6f5','하늘'],['#4a7ff0','파랑'],['#9b6cf0','보라'],['#cdb0ff','연보라'],['#ff9fcf','분홍'],
 ['#ff4fa3','진분홍'],['#ffd0b0','살구'],['#a8704a','갈색'],['#bfc3d6','회색'],['#4a4060','검정'],
 ['url(#g-rainbow)','무지개'],['url(#p-gold)','반짝이'],['url(#p-dots)','물방울'],['url(#p-stripe)','줄무늬'],['url(#p-heart)','하트'],
 ['erase','지우개']
];

/* ---------- state ---------- */
const KEY='alrok-coloring-v1';
let store={};try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){store={};}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}};
let soundOn=true;try{soundOn=localStorage.getItem(KEY+'-snd')!=='off';}catch(e){}
let cur='#ff5a6e', design=null, regions=[], fills=[], undo=[];

const $=id=>document.getElementById(id);
const svgOf=d=>`<svg class="art" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${d.svg}</svg>`;
const paintAll=(svg,f)=>svg.querySelectorAll('.r').forEach((el,i)=>{el.style.fill=f[i]||'#fff';});
const isDone=(d,f)=>{const n=(d.svg.match(/class="r/g)||[]).length;for(let i=0;i<n;i++)if(!f[i])return false;return true;};

/* ---------- home ---------- */
function renderHome(){
  const g=$('grid');g.innerHTML='';
  DESIGNS.forEach(d=>{
    const b=document.createElement('button');b.className='card';b.setAttribute('aria-label',d.name+' 색칠하기');
    const f=store[d.id]||[];
    b.innerHTML=`<div class="thumb">${svgOf(d)}${isDone(d,f)?'<svg class="done" viewBox="0 0 30 30"><path d="M15 2 l3.8 8 8.7 1.2 -6.3 6 1.6 8.6 -7.8 -4.2 -7.8 4.2 1.6 -8.6 -6.3 -6 8.7 -1.2z" fill="#ffd23f" stroke="#3b2f4a" stroke-width="2" stroke-linejoin="round"/></svg>':''}</div><span class="name">${d.name}</span>`;
    paintAll(b.querySelector('svg.art'),f);
    b.onclick=()=>{blip(520);openDesign(d);};
    g.appendChild(b);
  });
}

/* ---------- paint ---------- */
function renderPalette(){
  const p=$('palette');p.innerHTML='';
  COLORS.forEach(([c,n])=>{
    const b=document.createElement('button');b.className='sw'+(c===cur?' on':'');b.setAttribute('aria-label',n);b.title=n;
    b.innerHTML=c==='erase'
      ?`<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="#fff" stroke="#3b2f4a" stroke-width="2.5"/><rect x="14" y="20" width="24" height="13" rx="3" fill="#ffb3c9" stroke="#3b2f4a" stroke-width="2.5" transform="rotate(-30 26 26)"/><path d="M20 30 l8 -5" stroke="#3b2f4a" stroke-width="2.5" transform="rotate(0)"/></svg>`
      :`<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" style="fill:${c}" stroke="#3b2f4a" stroke-width="2.5"/><ellipse cx="18" cy="17" rx="6" ry="4" fill="#fff" opacity=".45"/></svg>`;
    b.onclick=()=>{cur=c;blip(700);p.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on');};
    p.appendChild(b);
  });
}
function openDesign(d){
  design=d;fills=(store[d.id]||[]).slice();undo=[];
  $('ptitle').textContent=d.name;
  $('board').innerHTML=svgOf(d);
  const svg=$('board').querySelector('svg');regions=[...svg.querySelectorAll('.r')];
  paintAll(svg,fills);
  $('home').hidden=true;$('paint').hidden=false;hideConfirm();updUndo();fit();
}
function fit(){
  if($('paint').hidden)return;
  const r=$('stage').getBoundingClientRect();const s=Math.max(120,Math.floor(Math.min(r.width,r.height)));
  const b=$('board');b.style.width=s+'px';b.style.height=s+'px';
}
addEventListener('resize',fit);
const updUndo=()=>{$('undo').disabled=!undo.length;};

$('board').addEventListener('pointerdown',e=>{
  const el=e.target.closest&&e.target.closest('.r');if(!el)return;
  e.preventDefault();
  const i=regions.indexOf(el);if(i<0)return;
  const next=cur==='erase'?null:cur, prev=fills[i]||null;
  if(prev===next){return;}
  const wasDone=isDone(design,fills);
  undo.push([i,prev]);fills[i]=next;el.style.fill=next||'#fff';
  store[design.id]=fills.slice();save();updUndo();
  sparkle(e);blip(next?600+Math.random()*300:380);
  if(!wasDone&&isDone(design,fills))setTimeout(celebrate,450);
});
$('undo').onclick=()=>{const u=undo.pop();if(!u)return;const[i,prev]=u;fills[i]=prev;regions[i].style.fill=prev||'#fff';store[design.id]=fills.slice();save();updUndo();blip(420);};
$('back').onclick=()=>{blip(480);$('paint').hidden=true;$('home').hidden=false;renderHome();};
$('reset').onclick=()=>{$('confirm').hidden=false;['undo','reset','sound'].forEach(id=>$(id).hidden=true);};
function hideConfirm(){$('confirm').hidden=true;['undo','reset','sound'].forEach(id=>$(id).hidden=false);}
$('no').onclick=hideConfirm;
$('yes').onclick=()=>{fills=[];undo=[];regions.forEach(r=>r.style.fill='#fff');store[design.id]=[];save();updUndo();hideConfirm();blip(300);};

/* sparkles */
const SPARK=['#ffd23f','#ff5fa2','#7cc6ff','#8fdc6e','#a07af0'];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function sparkle(e){
  if(reduce)return;const b=$('board'),r=b.getBoundingClientRect();
  for(let k=0;k<7;k++){
    const s=document.createElement('div');s.className='spark';
    const a=Math.random()*Math.PI*2,d=30+Math.random()*40;
    s.style.left=(e.clientX-r.left)+'px';s.style.top=(e.clientY-r.top)+'px';
    s.style.background=SPARK[k%SPARK.length];
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
    b.appendChild(s);setTimeout(()=>s.remove(),650);
  }
}

/* celebration */
function celebrate(){
  $('partyMsg').textContent=design.name+' 그림이 정말 예뻐졌어요';
  $('party').hidden=false;[0,150,300,450].forEach((t,i)=>setTimeout(()=>blip(600+i*150),t));
}
$('stay').onclick=()=>{$('party').hidden=true;};
$('next').onclick=()=>{$('party').hidden=true;$('paint').hidden=true;$('home').hidden=false;renderHome();};

/* sound */
let ac=null;
function blip(f){
  if(!soundOn)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.6,t+.09);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.16);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.18);
  }catch(e){}
}
function updSound(){$('wave').style.opacity=soundOn?1:0;$('sound').setAttribute('aria-label',soundOn?'소리 끄기':'소리 켜기');}
$('sound').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem(KEY+'-snd',soundOn?'on':'off');}catch(e){}updSound();blip(660);};

/* start: if nothing colored yet, show a sample on the first picture so the gallery isn't blank */
if(!Object.keys(store).length){
  store.unicorn=['#fff6fb','url(#p-gold)','#ffd23f','#ffc83d','#ff9fcf','#cdb0ff','#62c6f5','#ff9fcf','#cdb0ff','#62c6f5',null,null,'url(#g-rainbow)',null,'#ffe3f0','#ff9fcf','#ff9fcf','#ff9fcf'];
}
renderHome();renderPalette();updSound();
</script>
